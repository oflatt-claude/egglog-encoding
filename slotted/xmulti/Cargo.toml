# Standalone oracle: runs a multipattern through the reference
# `slotted-egraphs` implementation so the egglog encoding can be diffed
# against it. Its own workspace, so it stays out of the root build.
[workspace]

[package]
name = "xmulti"
version = "0.1.0"
edition = "2021"

[dependencies]
# Pinned to a REV rather than a local path, so a runner with no checkout of the
# reference can build this and the differential half can run in CI.
#
# This is https://github.com/memoryleak47/slotted-egraphs/pull/46 plus the
# independently stacked weak-shape fix at
# https://github.com/oflatt-claude/slotted-egraphs/pull/1. The latter is required
# for legal terms that reuse one printed name in bound and uncovered/free positions.
# It changes add/lookup normalization, not either matcher. PR 46 also carries the
# `MultiPattern` FLEXIBLE slot `$?x`, which is how a pattern variable in a binder
# column is put to the reference (see `atom_lines` in `slotted-encoder.py`). The rev
# lives in oflatt's fork until the PR carrying it into oflatt-claude's branch is
# merged; the SHAs are the same on both once it is fast-forwarded.
#
# Matching here reads a binder's bound slot as any name, a free variable's included,
# and so does the encoding; a rule that rebinds such a slot over something it matched
# outside the binder owes a `not-free` guard (`capture_guards` in the encoder), which
# both sides evaluate. The oracle is not asked to be stricter than that.
#
# All registered differential and isomorphism checks use `MultiPattern`: that is the
# pattern language the encoding implements. The helper binary retains a dormant
# `nested` directive for the unregistered matcher-comparison diagnostic, but
# `ematch_all` is not used as ground truth. The `checks` feature and explicit
# `eg.check()` calls make malformed reference state a hard failure.
slotted-egraphs = { git = "https://github.com/oflatt/slotted-egraphs.git", rev = "7bfa78208a56984c29192fff32e7cd8357db6ad5" }

[features]
# The differential harness wants malformed reference state to be a hard failure, so
# the crate's `checks` are on by default. A timing run wants the crate as the paper's
# experiments ran it: `cargo build --release --no-default-features`, which is what
# `make slotted-eval` does. The binary says which it is on its `CONFIG` line.
default = ["checks"]
checks = ["slotted-egraphs/checks"]

