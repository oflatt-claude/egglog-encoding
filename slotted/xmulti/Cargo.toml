# Standalone oracle: runs a multipattern through the reference
# `slotted-egraphs` implementation so the egglog encoding can be diffed
# against it. Its own workspace, so it stays out of the root build.
[workspace]

[package]
name = "xmulti"
version = "0.1.0"
edition = "2021"

[dependencies]
# Pinned to a REV rather than a local path, so a runner with no checkout of the
# reference can build this and the differential half can run in CI.
#
# This is upstream `main` (b90adca, after selected fixes from the closed PR #45 were
# applied) plus https://github.com/memoryleak47/slotted-egraphs/pull/46, which is why
# it points at a fork. Besides the original three fixes, the pinned revision repairs
# the reference's own remaining checked failures, preserves lexical scope in nested
# e-matching, and fixes weak-shape binder/free collisions. Its checked suite is green
# (98 passed, 12 ignored at the time of this audit).
#
# A green implementation is still not an unquestionable ground truth. In particular,
# flattened `MultiPattern` does not preserve every lexical role represented by nested
# `Rewrite`; `xsdql.py reference-limitations` keeps an exact witness executable.
#
# Revert to an upstream rev when #46 merges. What `main` alone answers is still worth
# keeping reachable: `XSDQL_FLAT=0` / `XARRAY_FLAT=0` drive the nested matcher, which is
# where `let-binop4` shows the bug #46 fixes.
slotted-egraphs = { git = "https://github.com/oflatt-claude/slotted-egraphs.git", rev = "b92d9e554727ef45c4092012d1414885ee2461a1", features = ["checks"] }
