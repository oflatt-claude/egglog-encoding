[package]
name = "egglog-experimental"
version = "0.1.0"
edition = "2024"
description = "Experimental extensions to the egglog language."
repository = "https://github.com/egraphs-good/egglog-experimental"
keywords = ["e-graphs", "egglog", "datalog", "compiler", "equality"]
license = "MIT"
readme = "README.md"

[[test]]
harness = false
name = "files"

[features]
default = ["bin"]
bin = ["egglog/bin"]

[dependencies]
# Point at the LOCAL egglog fork (../egglog) so experimental tracks this repo's
# egglog (including the Backend-trait work), per the monorepo's intent.
egglog = { path = "../egglog", default-features = false }
egglog-ast = { path = "../egglog/egglog-ast", default-features = false }
egglog-reports = { path = "../egglog/egglog-reports", default-features = false }

num = "0.4.3"
lazy_static = "1.4"
log = "0.4"

[dev-dependencies]
glob = "0.3.1"
libtest-mimic = "0.8.1"
