# Standalone oracle: runs a multipattern through the reference
# `slotted-egraphs` implementation so the egglog encoding can be diffed
# against it. Its own workspace, so it stays out of the root build.
[workspace]

[package]
name = "xmulti"
version = "0.1.0"
edition = "2021"

[dependencies]
# Pinned to a REV rather than a local path, so a runner with no checkout of the
# reference can build this and the differential half can run in CI.
#
# b90adca is upstream `main` after PR #45 was merged. Two things in it matter here:
# the `extend_subst` canonicalisation fix (published 0.0.36 predates it and answers
# differently on last-binding matches), and `final_refine`, which branches on both
# readings of a slot pair whose equality e-matching left undecided.
slotted-egraphs = { git = "https://github.com/memoryleak47/slotted-egraphs.git", rev = "b90adca9a9877aa9cc42adc8ccfc1c84841fde09" }
